    <script>
      // Safe alert and modal guard for sandboxed iframe compatibility
      if (typeof window !== 'undefined') {
        try {
          const _origAlert = window.alert;
          window.alert = function(msg) {
            console.info('[AutoCinema Alert]:', msg);
            try {
              if (_origAlert) _origAlert.call(window, msg);
            } catch (_) {}
          };
          const _origConfirm = window.confirm;
          window.confirm = function(msg) {
            console.info('[AutoCinema Confirm]:', msg);
            try {
              if (_origConfirm) return _origConfirm.call(window, msg);
            } catch (_) {}
            return true;
          };
        } catch (_) {}
      }
    </script>
